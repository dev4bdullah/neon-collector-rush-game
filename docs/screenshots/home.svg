<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#071421"/>
      <stop offset="45%" stop-color="#120b2d"/>
      <stop offset="100%" stop-color="#050a1a"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0" x2="1">
      <stop offset="0%" stop-color="#6ff7ff"/>
      <stop offset="100%" stop-color="#1ad4ff"/>
    </linearGradient>
    <linearGradient id="greenGlow" x1="0" x2="1">
      <stop offset="0%" stop-color="#93ffb8"/>
      <stop offset="100%" stop-color="#2ef2a7"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#00eaff" flood-opacity="0.9"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>

  <g opacity="0.9">
    <circle cx="100" cy="80" r="2" fill="#fff"/>
    <circle cx="220" cy="180" r="2" fill="#fff"/>
    <circle cx="360" cy="110" r="2" fill="#fff"/>
    <circle cx="500" cy="140" r="2" fill="#fff"/>
    <circle cx="640" cy="90" r="2" fill="#fff"/>
    <circle cx="820" cy="160" r="2" fill="#fff"/>
    <circle cx="980" cy="120" r="2" fill="#fff"/>
    <circle cx="1140" cy="90" r="2" fill="#fff"/>
    <circle cx="155" cy="280" r="2" fill="#fff"/>
    <circle cx="400" cy="260" r="2" fill="#fff"/>
    <circle cx="690" cy="220" r="2" fill="#fff"/>
    <circle cx="930" cy="250" r="2" fill="#fff"/>
    <circle cx="1080" cy="210" r="2" fill="#fff"/>
    <circle cx="1180" cy="300" r="2" fill="#fff"/>
    <circle cx="190" cy="500" r="2" fill="#fff"/>
    <circle cx="470" cy="660" r="2" fill="#fff"/>
    <circle cx="735" cy="610" r="2" fill="#fff"/>
    <circle cx="1100" cy="560" r="2" fill="#fff"/>
  </g>

  <g filter="url(#shadow)">
    <text x="640" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="74" font-weight="700" fill="#d8fefc" letter-spacing="4">NEON</text>
    <text x="640" y="330" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="86" font-weight="800" fill="url(#cyanGlow)" letter-spacing="3">COLLECTOR</text>
    <text x="640" y="405" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="68" font-weight="700" fill="#93ffb8" letter-spacing="5">RUSH</text>
  </g>

  <g>
    <rect x="490" y="470" width="300" height="90" rx="20" fill="#0d1428" stroke="url(#cyanGlow)" stroke-width="4"/>
    <text x="640" y="528" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#dffef7">START</text>
  </g>

  <g opacity="0.9">
    <rect x="210" y="525" width="160" height="70" rx="18" fill="#0d1428" stroke="#1ad4ff" stroke-width="3"/>
    <polygon points="255,555 315,525 315,585" fill="#6ff7ff"/>
    <text x="290" y="600" text-anchor="middle" font-size="24" fill="#dffef7" font-family="Segoe UI, Arial, sans-serif">LEFT</text>

    <rect x="910" y="525" width="160" height="70" rx="18" fill="#0d1428" stroke="#1ad4ff" stroke-width="3"/>
    <polygon points="1025,555 965,525 965,585" fill="#6ff7ff"/>
    <text x="990" y="600" text-anchor="middle" font-size="24" fill="#dffef7" font-family="Segoe UI, Arial, sans-serif">RIGHT</text>
  </g>

  <g>
    <polygon points="640,90 680,170 640,150 600,170" fill="url(#greenGlow)" opacity="0.9"/>
    <circle cx="640" cy="522" r="32" fill="#37f4a8" opacity="0.85"/>
    <circle cx="495" cy="382" r="28" fill="#ff4d6d" opacity="0.9"/>
    <circle cx="789" cy="430" r="20" fill="#ff4d6d" opacity="0.8"/>
  </g>
</svg>
